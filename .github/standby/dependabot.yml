# =============================================================================
# Dependabot — STANDING BY (not active)
# =============================================================================
# This config is complete and correct but intentionally NOT executed.
# Dependabot only reads .github/dependabot.yml.
#
# To activate: move this file to .github/dependabot.yml and push.
# =============================================================================

version: 2

updates:
  # Keeps GitHub Actions (including SHA-pinned actions) up to date.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Composer dependencies (PHP + Laravel).
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: auto

  # npm dependencies (pnpm lockfile is supported by the npm ecosystem).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
