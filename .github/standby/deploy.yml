# =============================================================================
# Deploy Production — STANDING BY (not active)
# =============================================================================
# This workflow is complete and correct but intentionally NOT executed.
# GitHub Actions only reads workflows from .github/workflows/.
#
# To activate: move this file to .github/workflows/deploy.yml (requires the
# LARAVEL_CLOUD_DEPLOY_HOOK secret) and push.
# =============================================================================

name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify releasable main
    runs-on: ubuntu-latest
    steps:
      - name: Require the current main head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploys must be dispatched from the main branch." >&2
            exit 1
          fi

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if [ "${GITHUB_SHA}" != "${main_sha}" ]; then
            echo "The selected commit is not the current main head." >&2
            echo "Selected: ${GITHUB_SHA}" >&2
            echo "Current:  ${main_sha}" >&2
            exit 1
          fi

      - name: Require successful CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="${GITHUB_SHA}" \
              -f status=success \
              -f per_page=1 \
              --jq '.total_count'
          )"

          if [ "${successful_runs}" -lt 1 ]; then
            echo "No successful main CI run exists for ${GITHUB_SHA}." >&2
            echo "Wait for CI to pass before dispatching production." >&2
            exit 1
          fi

  deploy:
    name: Deploy Laravel Cloud
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Laravel Cloud deploy hook
        env:
          LARAVEL_CLOUD_DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "${LARAVEL_CLOUD_DEPLOY_HOOK:-}" ]; then
            echo "Missing production secret LARAVEL_CLOUD_DEPLOY_HOOK." >&2
            exit 1
          fi

          echo "Deploying main commit ${GITHUB_SHA} to Laravel Cloud…"
          curl --fail --silent --show-error -X POST \
            "${LARAVEL_CLOUD_DEPLOY_HOOK}?commit_hash=${GITHUB_SHA}"
          echo "Deploy hook accepted."
